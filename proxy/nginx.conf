env CODER_MODEL;
env LLAMA_MODEL;
env VISION_MODEL;
env PROMPT_PIPELINE;
env AIDEN_ADMIN_TOKEN;
env INFERENCE_BACKEND;
env LLAMA_BACKEND;
env AIDEN_CTX_SIZE;
env AIDEN_CTX_RESERVE;

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 200m;
    client_body_buffer_size 200m;

    # Inference backends resolved at request time (no static upstream — ollama may be absent).

    init_by_lua_block {
        cjson = require "cjson"

        local MARK_CAVEMAN = "[AIDEN-CAVEMAN]"
        local MARK_CLAW = "[AIDEN-CLAW]"
        local MARK_PIPE = "[AIDEN-PIPE:v1]"

        local cave_fb = [[Respond terse like smart caveman. All technical substance stay. Only fluff die.
ACTIVE EVERY RESPONSE unless user says "stop caveman" or "normal mode".

RULES — Drop filler, hedging, pleasantries; fragments OK. Technical terms/code exact. Preserve code blocks verbatim.
Pattern: observation + fix. Not: long preamble.
Pause caveman tone only for destructive-irreversible warnings until user acknowledges clarity.]]

        caveman_block = cave_fb .. "\n-- " .. MARK_CAVEMAN .. " --\n"

        local fc = io.open("/usr/local/openresty/nginx/conf/caveman-system.txt", "rb")
        if fc then
            local txt = fc:read("*a")
            fc:close()
            if txt and #txt > 50 then caveman_block = txt .. "\n-- " .. MARK_CAVEMAN .. " --\n" end
        end

        local claw_fb = [[You are operating in an AI.DEN “claw-stage” policy: stay tool- and code-oriented, complete and accurate, minimize preamble. Finer brevity constraints may follow in a later system block.]]

        claw_block = claw_fb .. "\n-- " .. MARK_CLAW .. " --\n"

        local fz = io.open("/usr/local/openresty/nginx/conf/claw-system.txt", "rb")
        if fz then
            local txt = fz:read("*a")
            fz:close()
            if txt and #txt > 20 then claw_block = txt .. "\n-- " .. MARK_CLAW .. " --\n" end
        end

        local PIPE_FILE = "/usr/local/openresty/nginx/conf/prompt-pipeline.json"

        local function trim(s)
            return string.match(s or "", "^%s*(.-)%s*$") or ""
        end

        function aiden_load_pipeline_stages()
            local stages = {}
            local f = io.open(PIPE_FILE, "rb")
            if f then
                local txt = f:read("*a")
                f:close()
                local ok, data = pcall(cjson.decode, txt)
                if ok and type(data) == "table" and type(data.stages) == "table" then
                    for _, raw in ipairs(data.stages) do
                        if type(raw) == "string" then
                            local n = string.lower(trim(raw))
                            if n == "claw" or n == "caveman" then table.insert(stages, n) end
                        end
                    end
                    if #stages > 0 then return stages end
                end
            end

            local raw = os.getenv("PROMPT_PIPELINE") or "claw,caveman"
            for s in string.gmatch(raw, "([^,]+)") do
                local n = string.lower(trim(s))
                if n == "claw" or n == "caveman" then table.insert(stages, n) end
            end
            return stages
        end

        local function content_has_marker(content, marker)
            if type(content) == "string" then
                return string.find(content, marker, 1, true) ~= nil
            end
            if type(content) == "table" then
                for _, part in ipairs(content) do
                    if type(part) == "table" and type(part.text) == "string" then
                        if string.find(part.text, marker, 1, true) then return true end
                    end
                end
            end
            return false
        end

        function aiden_msgs_should_skip(messages)
            if type(messages) ~= "table" then return true end
            for _, m in ipairs(messages) do
                if m and (m.role == "system" or m.role == "developer") then
                    if content_has_marker(m.content, MARK_PIPE) then return true end
                end
            end
            return false
        end

        function aiden_build_combined_block(stages)
            if not stages or #stages == 0 then return nil end
            local parts = {}
            for _, n in ipairs(stages) do
                if n == "claw" and claw_block and #claw_block > 0 then
                    table.insert(parts, claw_block)
                elseif n == "caveman" and caveman_block and #caveman_block > 0 then
                    table.insert(parts, caveman_block)
                end
            end
            if #parts == 0 then return nil end
            return table.concat(parts, "\n\n--- AIDEN PROMPT PIPE ---\n\n") .. "\n-- " .. MARK_PIPE .. " --\n"
        end

        local function merge_block_into_content(content, block)
            if type(content) == "string" then
                return block .. "\n" .. content
            end
            if type(content) == "table" then
                local out = { { type = "text", text = block .. "\n" } }
                for _, part in ipairs(content) do
                    table.insert(out, part)
                end
                return out
            end
            return block
        end

        function aiden_prepend_pipeline_messages(msgs, block)
            if type(msgs) ~= "table" or #msgs < 1 then return false end
            for i, m in ipairs(msgs) do
                if m and (m.role == "system" or m.role == "developer") then
                    m.content = merge_block_into_content(m.content, block)
                    return true
                end
            end
            table.insert(msgs, 1, { role = "system", content = block })
            return true
        end

        function aiden_inject_pipeline_chat(data)
            local stages = aiden_load_pipeline_stages()
            local block = aiden_build_combined_block(stages)
            if not block then return false, stages end
            if aiden_msgs_should_skip(data.messages) then return false, stages end
            local ok = aiden_prepend_pipeline_messages(data.messages, block)
            return ok, stages
        end

        function aiden_inject_pipeline_generate(data)
            local stages = aiden_load_pipeline_stages()
            local block = aiden_build_combined_block(stages)
            if not block then return false, stages end
            if type(data.prompt) ~= "string" then return false, stages end
            local sys = data.system
            if type(sys) == "string" and string.find(sys, MARK_PIPE, 1, true) then
                return false, stages
            end
            if type(sys) == "string" and #sys > 0 then
                data.system = block .. "\n" .. sys
            else
                data.system = block
            end
            return true, stages
        end

        -- Rough token budget for Cursor Agent / large MCP payloads (chars ≈ 4 per token)
        function aiden_content_chars(content)
            if type(content) == "string" then
                return #content
            end
            if type(content) == "table" then
                local n = 0
                for _, part in ipairs(content) do
                    if type(part) == "table" and type(part.text) == "string" then
                        n = n + #part.text
                    end
                end
                return n
            end
            return 0
        end

        function aiden_message_chars(m)
            if not m or type(m) ~= "table" then return 0 end
            local n = aiden_content_chars(m.content)
            if type(m.tool_calls) == "table" then
                local ok, raw = pcall(cjson.encode, m.tool_calls)
                if ok and raw then n = n + #raw end
            end
            return n
        end

        function aiden_message_text(m)
            if not m or type(m) ~= "table" then return "" end
            local c = m.content
            if type(c) == "string" then
                return c
            end
            if type(c) == "table" then
                local parts = {}
                for _, part in ipairs(c) do
                    if type(part) == "table" and type(part.text) == "string" then
                        table.insert(parts, part.text)
                    end
                end
                return table.concat(parts, "\n")
            end
            return ""
        end

        function aiden_chars_per_token()
            local v = tonumber(os.getenv("AIDEN_CHARS_PER_TOKEN") or "2.8") or 2.8
            if v < 2.5 then v = 2.5 end
            if v > 6 then v = 6 end
            return v
        end

        function aiden_estimate_messages_tokens(messages)
            if type(messages) ~= "table" then return 0 end
            local chars = 0
            for _, m in ipairs(messages) do
                chars = chars + aiden_message_chars(m) + 16
            end
            return math.ceil(chars / aiden_chars_per_token())
        end

        function aiden_trim_budget(max_prompt)
            local margin = tonumber(os.getenv("AIDEN_PROMPT_ESTIMATE_MARGIN") or "0.90") or 0.90
            if margin < 0.75 then margin = 0.75 end
            if margin > 0.98 then margin = 0.98 end
            return math.floor(max_prompt * margin)
        end

        function aiden_reject_oversize_prompt(est, max_prompt)
            ngx.status = 413
            ngx.header["Content-Type"] = "application/json"
            ngx.header["X-AIDEN-Prompt-Tokens-Est"] = tostring(est)
            ngx.header["X-AIDEN-Context-Rejected"] = "prompt_too_large"
            local msg = "Prompt still ~" .. tostring(est)
                .. " tokens after truncation (limit " .. tostring(max_prompt)
                .. "). Shrink @context, start a new chat, or lower AIDEN_MAX_PROMPT_TOKENS."
            local body = cjson.encode({
                error = {
                    message = msg,
                    type = "aiden_prompt_too_large",
                    code = "context_length_exceeded"
                }
            })
            ngx.say(body)
            ngx.exit(413)
        end

        function aiden_shrink_content(content, max_chars)
            if max_chars < 800 then max_chars = 800 end
            if type(content) == "string" then
                if #content <= max_chars then return content end
                local head = math.floor(max_chars * 0.55)
                local tail = max_chars - head - 48
                if tail < 200 then tail = 200; head = max_chars - tail - 48 end
                return string.sub(content, 1, head)
                    .. "\n\n...[AIDEN: message truncated for context limit]...\n\n"
                    .. string.sub(content, -tail)
            end
            if type(content) == "table" then
                for _, part in ipairs(content) do
                    if type(part) == "table" and type(part.text) == "string" and #part.text > max_chars then
                        part.text = aiden_shrink_content(part.text, max_chars)
                    end
                end
            end
            return content
        end

        function aiden_compress_tool_messages(messages, keep_recent)
            if type(messages) ~= "table" then return false end
            keep_recent = keep_recent or 4
            local tool_max = tonumber(os.getenv("AIDEN_TOOL_RESULT_MAX_CHARS") or "4000") or 4000
            local changed = false
            local tool_idxs = {}
            for i, m in ipairs(messages) do
                if m and m.role == "tool" then table.insert(tool_idxs, i) end
            end
            local compress_until = #tool_idxs - keep_recent
            if compress_until < 1 then return false end
            for j = 1, compress_until do
                local m = messages[tool_idxs[j]]
                local chars = aiden_message_chars(m)
                if chars > tool_max then
                    m.content = aiden_shrink_content(
                        m.content,
                        tool_max,
                        "\n[AIDEN: earlier tool output compressed]"
                    )
                    changed = true
                end
            end
            return changed
        end

        function aiden_extract_checklist_anchor(messages)
            if type(messages) ~= "table" then return "" end
            local merged = {}
            local order = {}
            local function add_item(label, done)
                if not label or label == "" then return end
                local key = string.lower(label)
                if merged[key] == nil then
                    table.insert(order, key)
                end
                merged[key] = done
            end
            for i = 1, #messages do
                local text = aiden_message_text(messages[i])
                if type(text) == "string" then
                    if string.find(text, "%[AIDEN%-CHECKLIST%-ANCHOR%]", 1, true) then
                        for line in string.gmatch(text, "[^\r\n]+") do
                            local mark, item = string.match(line, "^%s*%-%s*%[([ xX])%]%s*(.+)$")
                            if item and not string.match(string.upper(item), "^CURRENT") then
                                add_item(item, mark == "x" or mark == "X")
                            end
                        end
                    end
                    for line in string.gmatch(text, "[^\r\n]+") do
                        local mark, item = string.match(line, "^%s*[-*+]%s*%[([ xX])%]%s*(.+)$")
                        if item then add_item(item, mark == "x" or mark == "X") end
                    end
                end
            end
            if #order < 1 then return "" end
            local lines = {
                "[AIDEN-CHECKLIST-ANCHOR]",
                "Task plan — continue from CURRENT after context trim (do not restart):"
            }
            local current = nil
            for _, key in ipairs(order) do
                local done = merged[key]
                local mark = done and "[x]" or "[ ]"
                table.insert(lines, "- " .. mark .. " " .. key)
                if not done and not current then current = key end
            end
            if current then
                table.insert(lines, "CURRENT (resume here): " .. current)
            end
            table.insert(lines, "Rules: Keep checklist updated; resume chat from CURRENT.")
            return table.concat(lines, "\n")
        end

        function aiden_prepend_checklist(content, anchor)
            if not anchor or anchor == "" then return content end
            if string.find(content, "%[AIDEN%-CHECKLIST%-ANCHOR%]", 1, true) then
                return content
            end
            return anchor .. "\n\n" .. content
        end

        function aiden_truncate_messages(messages)
            if type(messages) ~= "table" or #messages < 1 then
                return false
            end
            local ctx = tonumber(os.getenv("AIDEN_CTX_SIZE") or "16384") or 16384
            local reserve = tonumber(os.getenv("AIDEN_CTX_RESERVE") or "4096") or 4096
            if reserve < 1024 then reserve = 1024 end
            local max_prompt = ctx - reserve
            local hard_cap = tonumber(os.getenv("AIDEN_MAX_PROMPT_TOKENS") or "0") or 0
            if hard_cap > 2048 and max_prompt > hard_cap then
                max_prompt = hard_cap
            end
            local floor_cap = 3072
            if hard_cap > 2048 and hard_cap < floor_cap then
                floor_cap = hard_cap
            end
            if max_prompt < floor_cap then max_prompt = floor_cap end

            local per_msg_max = tonumber(os.getenv("AIDEN_MAX_MSG_CHARS") or "24000") or 24000
            local truncated = false

            if aiden_compress_tool_messages(messages, 4) then truncated = true end

            for _, m in ipairs(messages) do
                if aiden_message_chars(m) > per_msg_max then
                    m.content = aiden_shrink_content(m.content, per_msg_max)
                    truncated = true
                end
            end

            local trim_budget = aiden_trim_budget(max_prompt)
            local est = aiden_estimate_messages_tokens(messages)
            local drops = 0
            while est > trim_budget and #messages > 2 do
                local drop_idx = nil
                for i = 2, #messages - 1 do
                    local r = messages[i].role
                    if r ~= "system" and r ~= "developer" then
                        drop_idx = i
                        break
                    end
                end
                if not drop_idx then break end
                table.remove(messages, drop_idx)
                drops = drops + 1
                truncated = true
                est = aiden_estimate_messages_tokens(messages)
                if drops > 500 then break end
            end

            if drops > 0 then
                local anchor = aiden_extract_checklist_anchor(messages)
                local body = "[AIDEN-CONTEXT] " .. drops
                    .. " earlier turn(s) dropped to fit context. Continue the chat from the checklist anchor and recent messages."
                local note = {
                    role = "user",
                    content = aiden_prepend_checklist(body, anchor)
                }
                local insert_at = 1
                for i, m in ipairs(messages) do
                    if m.role == "system" or m.role == "developer" then
                        insert_at = i + 1
                    else
                        break
                    end
                end
                table.insert(messages, insert_at, note)
                truncated = true
            end

            -- Tier 2: still over budget — harsher tool compression + smaller per-message cap
            if est > trim_budget then
                if aiden_compress_tool_messages(messages, 2) then truncated = true end
                local tight = math.floor(per_msg_max * 0.45)
                if tight < 2000 then tight = 2000 end
                for _, m in ipairs(messages) do
                    if aiden_message_chars(m) > tight then
                        m.content = aiden_shrink_content(m.content, tight)
                        truncated = true
                    end
                end
                est = aiden_estimate_messages_tokens(messages)
                if est > trim_budget then
                    ngx.ctx.aiden_context_tier = "2"
                end
            end

            -- Tier 3 emergency: keep system + last 3 non-system messages (mutate in place)
            if est > trim_budget and #messages > 4 then
                local system_msgs = {}
                local rest = {}
                for _, m in ipairs(messages) do
                    if m.role == "system" or m.role == "developer" then
                        table.insert(system_msgs, m)
                    else
                        table.insert(rest, m)
                    end
                end
                local rebuilt = {}
                for _, m in ipairs(system_msgs) do table.insert(rebuilt, m) end
                local anchor = aiden_extract_checklist_anchor(messages)
                local emerg = "[AIDEN-EMERGENCY-CONTEXT] Router stripped older turns. Re-read files or continue from checklist CURRENT and recent messages."
                table.insert(rebuilt, {
                    role = "user",
                    content = aiden_prepend_checklist(emerg, anchor)
                })
                local start = #rest - 2
                if start < 1 then start = 1 end
                for i = start, #rest do
                    table.insert(rebuilt, rest[i])
                end
                for i = #messages, 1, -1 do
                    table.remove(messages, i)
                end
                for _, m in ipairs(rebuilt) do
                    table.insert(messages, m)
                end
                truncated = true
                ngx.ctx.aiden_context_tier = "3"
                est = aiden_estimate_messages_tokens(messages)
            end

            ngx.ctx.aiden_prompt_tokens_est = tostring(est)
            if truncated then
                ngx.ctx.aiden_context_truncated = "true"
                if drops > 0 then
                    ngx.ctx.aiden_context_dropped = tostring(drops)
                end
            end
            if est > max_prompt then
                aiden_reject_oversize_prompt(est, max_prompt)
            end
            return truncated
        end

        function aiden_clamp_completion_tokens(data)
            if type(data) ~= "table" then return end
            local cap = tonumber(os.getenv("AIDEN_MAX_COMPLETION_TOKENS") or "1536") or 1536
            if cap < 256 then cap = 256 end
            if data.max_tokens and tonumber(data.max_tokens) and tonumber(data.max_tokens) > cap then
                data.max_tokens = cap
            end
        end

        function aiden_resolve_inference_upstream()
            local backend = os.getenv("INFERENCE_BACKEND")
            if not backend or backend == "" then
                backend = os.getenv("LLAMA_BACKEND") or "llamacpp"
            end
            backend = string.lower(backend)
            if backend == "llamacpp" or backend == "llama.cpp" or backend == "mtp" then
                return "http://llamacpp:8080"
            end
            return "http://ollama"
        end

        function rewrite_ollama_body(model_env_var)
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body or #body == 0 then return end

            local ok, data = pcall(cjson.decode, body)
            if not ok or type(data) ~= "table" then return end

            local uri = ngx.var.uri or ""
            local injected = false
            local stages = aiden_load_pipeline_stages()

            if model_env_var and model_env_var ~= "" then
                if not data.model or data.model == "" then
                    data.model = os.getenv(model_env_var) or "unknown"
                end
            end

            if uri == "/v1/chat/completions" or uri == "/api/chat" then
                injected, stages = aiden_inject_pipeline_chat(data)
                if type(data.messages) == "table" then
                    aiden_truncate_messages(data.messages)
                end
                aiden_clamp_completion_tokens(data)
            elseif uri == "/api/generate" or uri == "/v1/completions" then
                injected, stages = aiden_inject_pipeline_generate(data)
            end

            ngx.ctx.aiden_stages = table.concat(stages, ",")
            ngx.ctx.aiden_injected = injected and "true" or "false"
            ngx.ctx.aiden_backend = aiden_resolve_inference_upstream()

            local new_body = cjson.encode(data)
            ngx.req.set_body_data(new_body)
            ngx.req.set_header("Content-Length", tostring(#new_body))
        end

        function aiden_set_inference_upstream()
            ngx.var.inference_upstream = aiden_resolve_inference_upstream()
        end

        function aiden_emit_pipeline_headers()
            if ngx.ctx.aiden_stages and ngx.ctx.aiden_stages ~= "" then
                ngx.header["X-AIDEN-Pipeline-Stages"] = ngx.ctx.aiden_stages
            end
            if ngx.ctx.aiden_injected == "true" then
                ngx.header["X-AIDEN-Pipeline-Injected"] = "true"
            else
                ngx.header["X-AIDEN-Pipeline-Injected"] = "false"
            end
            if ngx.ctx.aiden_backend then
                ngx.header["X-AIDEN-Inference-Backend"] = ngx.ctx.aiden_backend
            end
            if ngx.ctx.aiden_prompt_tokens_est then
                ngx.header["X-AIDEN-Prompt-Tokens-Est"] = ngx.ctx.aiden_prompt_tokens_est
            end
            if ngx.ctx.aiden_context_truncated == "true" then
                ngx.header["X-AIDEN-Context-Truncated"] = "true"
                if ngx.ctx.aiden_context_dropped then
                    ngx.header["X-AIDEN-Context-Dropped"] = ngx.ctx.aiden_context_dropped
                end
            end
            if ngx.ctx.aiden_context_tier then
                ngx.header["X-AIDEN-Context-Tier"] = ngx.ctx.aiden_context_tier
            end
        end
    }

    # ── Port 11434: unified inference gateway + prompt pipeline ──
    server {
        listen 11434;
        server_name _;

        set $inference_upstream http://llamacpp:8080;

        include /usr/local/openresty/nginx/conf/aiden-pipeline-admin.conf;

        location / {
            access_by_lua_block {
                aiden_set_inference_upstream()
                rewrite_ollama_body("")
            }

            header_filter_by_lua_block { aiden_emit_pipeline_headers() }

            proxy_pass $inference_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8765;
        server_name _;

        set $inference_upstream http://llamacpp:8080;

        include /usr/local/openresty/nginx/conf/aiden-pipeline-admin.conf;

        location / {
            access_by_lua_block {
                aiden_set_inference_upstream()
                rewrite_ollama_body("CODER_MODEL")
            }

            header_filter_by_lua_block { aiden_emit_pipeline_headers() }

            proxy_pass $inference_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8766;
        server_name _;

        set $inference_upstream http://llamacpp:8080;

        include /usr/local/openresty/nginx/conf/aiden-pipeline-admin.conf;

        location / {
            access_by_lua_block {
                aiden_set_inference_upstream()
                rewrite_ollama_body("LLAMA_MODEL")
            }

            header_filter_by_lua_block { aiden_emit_pipeline_headers() }

            proxy_pass $inference_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8767;
        server_name _;

        set $inference_upstream http://llamacpp:8080;

        include /usr/local/openresty/nginx/conf/aiden-pipeline-admin.conf;

        location / {
            access_by_lua_block {
                aiden_set_inference_upstream()
                rewrite_ollama_body("VISION_MODEL")
            }

            header_filter_by_lua_block { aiden_emit_pipeline_headers() }

            proxy_pass $inference_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }
}
