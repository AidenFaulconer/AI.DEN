    # ── Prompt pipeline API (editable JSON on disk; overrides PROMPT_PIPELINE env when valid)
    location = /_aiden/pipeline {
        limit_except GET POST {
            deny all;
        }
        content_by_lua_block {
            local cjson = require "cjson"
            local PIPE_FILE = "/usr/local/openresty/nginx/conf/prompt-pipeline.json"
            local ADMIN_TOKEN = os.getenv("AIDEN_ADMIN_TOKEN")
            local m = ngx.req.get_method()

            local function bearer_ok()
                if not ADMIN_TOKEN or ADMIN_TOKEN == "" then return true end
                local h = ngx.req.get_headers()["Authorization"]
                return type(h) == "string"
                    and string.match(h, "^Bearer%s+%S+")
                    and h == ("Bearer " .. ADMIN_TOKEN)
            end

            if m == "GET" then
                local src = "env"
                local stages_s = {}
                local f = io.open(PIPE_FILE, "rb")
                if f then
                    local txt = f:read("*a")
                    f:close()
                    if txt and #txt > 5 then
                        local ok, p = pcall(cjson.decode, txt)
                        if ok and type(p) == "table" and type(p.stages) == "table" then
                            stages_s = p.stages
                            src = "file"
                        end
                    end
                end
                if src == "env" then
                    local raw = os.getenv("PROMPT_PIPELINE") or "claw,caveman"
                    for s in string.gmatch(raw, "([^,]+)") do
                        s = string.match(s, "^%s*(.-)%s*$")
                        if s and #s > 0 then table.insert(stages_s, s) end
                    end
                end
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.say(cjson.encode({ stages = stages_s, source = src }))
                return ngx.exit(200)
            end

            if m == "POST" then
                if not bearer_ok() then return ngx.exit(401) end
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body or body == "" then return ngx.exit(400) end
                local ok, p = pcall(cjson.decode, body)
                if not ok or type(p) ~= "table" then return ngx.exit(400) end
                local st = p.stages or p.pipeline
                if type(st) ~= "table" then return ngx.exit(400) end
                local out = {}
                for _, raw in ipairs(st) do
                    if type(raw) == "string" then
                        local n = string.lower(string.match(raw, "^%s*(.-)%s*$"))
                        if n == "claw" or n == "caveman" then table.insert(out, n) end
                    end
                end
                local wf = io.open(PIPE_FILE, "w")
                if not wf then
                    ngx.log(ngx.ERR, "[aiden] cannot write pipeline file")
                    return ngx.exit(500)
                end
                wf:write(cjson.encode({ stages = out }))
                wf:write("\n")
                wf:close()
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.say(cjson.encode({ ok = true, stages = out }))
                return ngx.exit(200)
            end

            return ngx.exit(405)
        }
    }

    # Preview injected system block (no upstream call) — verify claw/caveman orchestration
    location = /_aiden/pipeline/preview {
        content_by_lua_block {
            local cjson = require "cjson"
            local stages = aiden_load_pipeline_stages()
            local block = aiden_build_combined_block(stages)
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            ngx.header["X-AIDEN-Pipeline-Stages"] = table.concat(stages, ",")
            ngx.say(cjson.encode({
                stages = stages,
                injected_block = block or "",
                inference_backend = aiden_resolve_inference_upstream(),
                markers = { pipe = "[AIDEN-PIPE:v1]", claw = "[AIDEN-CLAW]", caveman = "[AIDEN-CAVEMAN]" }
            }))
        }
    }

    location = /_aiden/openapi.yaml {
        default_type application/yaml;
        alias /usr/local/openresty/nginx/conf/router-openapi.yaml;
    }

    location = /_aiden/swagger {
        default_type text/html;
        charset utf-8;
        alias /usr/local/openresty/nginx/conf/swagger.html;
    }
