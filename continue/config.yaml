# AI.DEN → VS Code Continue — sync via scripts/sync-continue-config.ps1
# After .env changes: .\scripts\sync-continue-config.ps1 then reload Continue.
# 4GB profile: ctx 16384, router :8765 (not :8081), @repo-map signatures off, prompt cap ~6144.
name: AI.DEN Local
version: 1.0.0
schema: v1

models:
  - name: AI.DEN Fast (Qwen3.5-9B MTP, auto-routed)
    provider: openai
    model: Qwen3.5-9B-UD-Q4_K_XL.gguf
    apiBase: http://localhost:8765/v1
    apiKey: ollama
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
      - summarize
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 512
      contextLength: 16384
    requestOptions:
      timeout: 300000
    chatOptions:
      baseAgentSystemMessage: |
        You are on AI.DEN **fast** tier (Qwen3.5-9B MTP). Same apiBase and caveman pipeline as the 27B coder.
        For hard refactors, security, or multi-file agent work, switch to **AI.DEN Coder (quality)** or set header X-AIDEN-Model-Tier: quality.
        File paths: glob_files before read_file; MCP on :5000. Prefer @tree / subfolder @repo-map on 4GB.

  - name: AI.DEN Coder (Qwen3.6 quality + pipeline)
    provider: openai
    model: Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
    apiBase: http://localhost:8765/v1
    apiKey: ollama
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
      - summarize
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 1024
      contextLength: 16384
    requestOptions:
      timeout: 300000
    chatOptions:
      baseAgentSystemMessage: |
        You are a coding agent on AI.DEN (local Qwen + MCP on :5000).

        API: Use this model's apiBase (http://localhost:8765/v1) — model-router + caveman pipeline.
        Default model omits `model` → router auto-picks fast (9B) vs this 27B from task complexity.
        Do not use bare llama.cpp :8081 (no pipeline, no prompt cap).

        File paths (MCP — critical):
        - Never guess paths (e.g. frontend/src/components/forms/contact.jsx). Verify first:
          glob_files pattern="**/FileName*" or grep_search, then read_file.
        - If read_file fails: call workspace_info; check VS Code opened folder vs path prefix.
        - Workspace = MCP roots. If VS Code root is AI.DEN only, prefix sibling apps:
          House-App/frontend/src/components/... (not bare frontend/... under AI.DEN).
        - Prefer opening the app repo as the VS Code folder when editing that app.
        - Large files: read_file with start_line and end_line (contextLength is 16k).

        Context / CPU (RTX 3050 Ti 4GB):
        - Prefer @tree or @repo-map on a subfolder — not whole monorepo.
        - When context compacts, keep going in the same chat — do not restart the task.
        - For multi-step work, maintain a markdown checklist (- [ ] / - [x]) and update it each step.
        - After [AIDEN-CONTEXT] or [AIDEN-CHECKLIST-ANCHOR], resume from CURRENT (first unchecked item).
        - Use MCP tools only via native tool_calls (read_file, glob_files, edit_file, grep_search,
          list_dir, workspace_info, get_session_summary, symbol_search, library_docs, web_search, fetch_url,
          run_command, project_tasks). Not context7_docs (use library_docs). See docs/tool-policy.md.

        Workflow:
        1. Errors: user attaches @problems and/or @terminal.
        2. After edits: project_tasks → run_tests or run_command; stack via docker compose in MCP.
        3. Host scripts (start-aiden.bat, npm run dev): user runs in VS Code terminal, then @terminal.

  - name: AI.DEN General (8766)
    provider: openai
    model: Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
    apiBase: http://localhost:8766/v1
    apiKey: ollama
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 1024
      contextLength: 16384
    requestOptions:
      timeout: 300000

  - name: AI.DEN Autocomplete (optional)
    provider: openai
    model: Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
    apiBase: http://localhost:8765/v1
    apiKey: ollama
    roles:
      - autocomplete
    autocompleteOptions:
      disable: true
      debounceDelay: 600
      maxPromptTokens: 1024
      onlyMyCode: true

rules:
  - uses: continue/rules.md
  - uses: continue/agent-workflow.md

# @-mention context (type @ in Continue chat/agent)
context:
  - provider: problems
  - provider: terminal
  - provider: currentFile
  - provider: code
  - provider: diff
  - provider: file
  - provider: open
    params:
      onlyPinned: false
  # Low-CPU: @tree is cheap; @repo-map only on a subfolder (not entire vibe-coding). Signatures off on 4GB.
  - provider: repo-map
    params:
      includeSignatures: false
  - provider: os
  - provider: tree

prompts:
  - uses: continue/prompts/fix-errors.md
  - uses: continue/prompts/run-tests.md
  - uses: continue/prompts/start-stack.md
  - uses: continue/prompts/claw-terminal.md

mcpServers:
  - name: AI.DEN Ollama MCP
    type: streamable-http
    url: http://localhost:5000/mcp
    connectionTimeout: 20000

# Agent mode (not plain Chat) required for MCP tools to run automatically.
# MCP: project_tasks, run_tests, run_command, library_docs, symbol_search, …
# See docs/continue-vscode.md
